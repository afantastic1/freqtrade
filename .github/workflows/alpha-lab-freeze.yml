
name: Alpha Lab verification

on:
  push:
    branches:
      - "fix/**"
      - "codex/**"
      - "my_dev"
    paths:
      - "alpha_lab/**"
      - "alpha_lab_contracts/**"
      - "alpha_lab_service/**"
      - "containers/alpha-lab-factor-worker/**"
      - "scripts/alpha_lab_admission_gate.py"
      - ".github/CODEOWNERS"
      - ".github/workflows/alpha-lab-python-service.yml"
      - "data_engineering/**"
      - "tests/test_data_engineering*.py"
      - "tests/test_fundamental*.py"
      - "tests/test_fundamentals.py"
      - "tests/test_pit_*.py"
      - "tests/test_cross_sectional_fundamental_runner.py"
      - ".opencode/**"
      - ".github/workflows/alpha-lab-freeze.yml"
      - "notes/statistical_method_audit.md"
      - "notes/statistical_method_registry.md"
      - "notes/statistical_freeze_report.md"
      - "notes/alpha_lab_next_steps.md"

  pull_request:
    paths:
      - "alpha_lab/**"
      - "alpha_lab_contracts/**"
      - "alpha_lab_service/**"
      - "containers/alpha-lab-factor-worker/**"
      - "scripts/alpha_lab_admission_gate.py"
      - ".github/CODEOWNERS"
      - ".github/workflows/alpha-lab-python-service.yml"
      - "data_engineering/**"
      - "tests/test_data_engineering*.py"
      - "tests/test_fundamental*.py"
      - "tests/test_fundamentals.py"
      - "tests/test_pit_*.py"
      - "tests/test_cross_sectional_fundamental_runner.py"
      - ".opencode/**"
      - "docs/alpha_lab/**"
      - ".github/workflows/alpha-lab-freeze.yml"
      - "notes/statistical_method_audit.md"
      - "notes/statistical_method_registry.md"
      - "notes/statistical_freeze_report.md"
      - "notes/alpha_lab_next_steps.md"

permissions:
  contents: read

jobs:
  regression:
    name: Alpha Lab regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -e . -r requirements-dev.txt
          python -m pip install -e "./data_engineering[test]"

      - name: Check Python compilation
        run: python -m compileall -q alpha_lab alpha_lab_contracts data_engineering

      - name: Run research tests
        run: |
          python -m pytest -o addopts='' -q \
            alpha_lab_contracts/tests/ \
            alpha_lab/tests/ \
            alpha_lab/calibration/ \
            tests/test_data_engineering.py \
            tests/test_data_engineering_packaging.py \
            tests/test_cross_sectional_fundamental_runner.py \
            tests/test_fundamental_asof.py \
            tests/test_fundamental_feature_bridge.py \
            tests/test_fundamental_registries.py \
            tests/test_fundamentals.py \
            tests/test_pit_audit.py \
            tests/test_pit_evidence.py \
            data_engineering/scripts/test_fundamental_coverage_audit.py

      - name: Statistical self-check
        run: python -m alpha_lab.stats.selfcheck

  freeze:
    name: Frozen core verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      - name: Install locked governance environment
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/alpha-lab-governance-venv
        run: uv sync --project alpha_lab_service --locked --group test

      - name: Verify freeze manifest
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/alpha-lab-governance-venv
        run: |
          uv run --project alpha_lab_service --locked python -m alpha_lab.freeze --manifest alpha_lab/freeze-manifest-core-v1.2.json
          uv run --project alpha_lab_service --locked python -m alpha_lab_service.governance
