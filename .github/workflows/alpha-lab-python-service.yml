name: Alpha Lab Python Factor Service

on:
  push:
    branches: ["fix/**", "codex/**", "my_dev"]
    paths:
      - "alpha_lab/**"
      - "alpha_lab_service/**"
      - "alpha_lab_local/**"
      - "alpha_lab_contracts/**"
      - "data_engineering/**"
      - "containers/alpha-lab-factor-worker/**"
      - "containers/alpha-lab-local-service/**"
      - "deploy/alpha-lab-local/**"
      - "scripts/alpha_lab_wsl_start.sh"
      - "scripts/alpha_lab_wsl_stop.sh"
      - "examples/opencode.alpha-lab.jsonc"
      - "scripts/alpha_lab_admission_gate.py"
      - ".github/CODEOWNERS"
      - ".github/workflows/alpha-lab-freeze.yml"
      - ".github/workflows/alpha-lab-python-service.yml"
      - "alpha_lab/freeze-manifest-v1.3.json"
      - "alpha_lab/freeze-manifest-v1.5.json"
      - "alpha_lab/freeze-manifest-v1.6.json"
      - "alpha_lab/freeze-manifest-v1.7.json"
      - "alpha_lab/freeze-manifest-v1.8.json"
      - "alpha_lab/freeze-manifest-core-v1.3.json"
      - "alpha_lab/freeze-manifest-core-v1.4.json"
      - "alpha_lab/freeze-manifest-core-v1.5.json"
      - "alpha_lab_service/protocol-manifest-v2.json"
      - "alpha_lab_service/protocol-manifest-v4.json"
      - "alpha_lab_service/protocol-manifest-v5.json"
      - "alpha_lab_service/protocol-manifest-v6.json"
      - "alpha_lab_service/protocol-manifest-v7.json"
      - "docs/alpha_lab/python-factor-*.md"
      - "docs/alpha_lab/unified-descriptive-evidence-acceptance.*"
      - "docs/alpha_lab/agent-research-gateway-acceptance.*"
  pull_request:
    paths:
      - "alpha_lab/**"
      - "alpha_lab_service/**"
      - "alpha_lab_local/**"
      - "alpha_lab_contracts/**"
      - "data_engineering/**"
      - "containers/alpha-lab-factor-worker/**"
      - "containers/alpha-lab-local-service/**"
      - "deploy/alpha-lab-local/**"
      - "scripts/alpha_lab_wsl_start.sh"
      - "scripts/alpha_lab_wsl_stop.sh"
      - "examples/opencode.alpha-lab.jsonc"
      - "scripts/alpha_lab_admission_gate.py"
      - ".github/CODEOWNERS"
      - ".github/workflows/alpha-lab-freeze.yml"
      - ".github/workflows/alpha-lab-python-service.yml"
      - "alpha_lab/freeze-manifest-v1.3.json"
      - "alpha_lab/freeze-manifest-v1.5.json"
      - "alpha_lab/freeze-manifest-v1.6.json"
      - "alpha_lab/freeze-manifest-v1.7.json"
      - "alpha_lab/freeze-manifest-v1.8.json"
      - "alpha_lab/freeze-manifest-core-v1.3.json"
      - "alpha_lab/freeze-manifest-core-v1.4.json"
      - "alpha_lab/freeze-manifest-core-v1.5.json"
      - "alpha_lab_service/protocol-manifest-v2.json"
      - "alpha_lab_service/protocol-manifest-v4.json"
      - "alpha_lab_service/protocol-manifest-v5.json"
      - "alpha_lab_service/protocol-manifest-v6.json"
      - "alpha_lab_service/protocol-manifest-v7.json"
      - "docs/alpha_lab/python-factor-*.md"
      - "docs/alpha_lab/unified-descriptive-evidence-acceptance.*"
      - "docs/alpha_lab/agent-research-gateway-acceptance.*"

permissions:
  contents: read

jobs:
  service-security:
    name: Protocol, descriptive E2E and Worker isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Configure UV environment outside checkout
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/alpha-lab-service-venv" >> "$GITHUB_ENV"
      - name: Install locked service test environment
        run: uv sync --project alpha_lab_service --locked --group test
      - name: Build pinned untrusted Worker
        run: |
          docker build --pull=false --build-arg PIP_INDEX_URL=https://pypi.org/simple -t alpha-lab-factor-worker:ci containers/alpha-lab-factor-worker
          echo "ALPHA_LAB_WORKER_IMAGE=$(docker image inspect --format '{{.Id}}' alpha-lab-factor-worker:ci)" >> "$GITHUB_ENV"
      - name: Build trusted local MCP image
        run: |
          docker build -f containers/alpha-lab-local-service/Dockerfile -t alpha-lab-local-service:ci .
          echo "ALPHA_LAB_LOCAL_SERVICE_IMAGE=alpha-lab-local-service:ci" >> "$GITHUB_ENV"
      - name: Verify v1.8 governance and service manifests
        run: uv run --project alpha_lab_service --locked python -m alpha_lab_service.governance
      - name: Run protocol, contract, store, MCP, causal and actual-container tests
        run: uv run --project alpha_lab_service --locked python -m pytest -q alpha_lab_service/tests/test_worker_container.py alpha_lab_service/tests/test_end_to_end.py alpha_lab_service/tests
      - name: Run trusted local Factory tests
        run: uv run --project alpha_lab_service --locked python -m pytest --confcutdir=alpha_lab_local -q alpha_lab_local/tests
      - name: Verify active governance and acceptance report
        run: uv run --project alpha_lab_service --locked python -m alpha_lab_service.governance
