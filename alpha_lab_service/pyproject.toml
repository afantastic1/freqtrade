[project]
name = "alpha-lab-python-factor-service"
version = "1.0.0"
description = "Isolated MCP service for descriptive Python factor experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp==1.27.2",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "pydantic==2.13.4",
    "scipy==1.17.1",
    "uvicorn==0.38.0",
]

[dependency-groups]
test = ["freqtrade", "pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-xdist==3.8.0"]

[tool.uv]
package = false

[tool.uv.sources]
freqtrade = { path = "..", editable = true }
